<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1e8">
  <meta name="description" content="Step up to a cable-car window overlooking a snowy mountain, reconstructed from one photograph. An interactive demo of VR Memories.">
  <title>Above the snowline · VR Memories</title>
  <link rel="stylesheet" href="./demo.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/postprocessing/Pass.js":"./vendor/Pass.js"}}</script>
  <script type="module" src="./demo.js"></script>
</head>
<body>
<header><a href="https://github.com/Alexasandrovich/vr-memories">VR Memories</a><a href="https://github.com/Alexasandrovich/vr-memories/blob/main/guides/setup.md">Use your photos ↗</a></header>
<main>
  <div class="title"><h1>Above the snowline<span>.</span></h1><p>A walk inside one photograph</p></div>
  <section id="stage" aria-label="Cable-car scene" tabindex="0">
    <video id="film" muted playsinline loop preload="metadata" poster="./walk/poster.webp" src="./walk/tour.mp4" aria-label="Camera moving toward the window and to the right as a snowy ridge comes into view"></video>
    <img id="photo" src="./walk/photo.webp" alt="A cable stretches past the window frame toward a snowy mountain peak." hidden>
    <div id="gpu" hidden></div>
    <div id="pad" role="group" aria-label="Walk controls" hidden>
      <button data-key="KeyW" aria-label="Walk forward">↑</button><button data-key="KeyA" aria-label="Step left">←</button><button data-key="KeyS" aria-label="Walk back">↓</button><button data-key="KeyD" aria-label="Step right">→</button>
    </div>
  </section>
  <div class="controls">
    <div class="buttons">
      <button id="explore" class="primary">Walk here <span aria-hidden="true">↗</span></button>
      <button id="tour">Pause tour</button>
      <button id="source" aria-pressed="false">Original photo</button>
    </div>
    <small id="status" role="status">Guided walk · 8 seconds</small>
  </div>
  <footer><p>Pick a photo in Quest. Step toward the window and follow the ridge with your eyes.</p><a href="https://github.com/Alexasandrovich/vr-memories">Explore the project ↗</a></footer>
</main>
</body></html>
