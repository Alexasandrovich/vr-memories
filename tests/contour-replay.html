<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"><title>SHARP contour replay</title><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><script type="module">
import * as T from 'three';
import {projectionShaders,correctionWeight,correctionDuration} from './reproject.js';
const [left,top]=await (await fetch("./qa/crop.json")).json();
const events=await (await fetch('./qa/events.json')).json(), pairs=[];
for(let i=0;i<events.length;i++){
 const video=await new T.TextureLoader().loadAsync('./qa/pair'+i+'.png');
 video.colorSpace=T.NoColorSpace;video.generateMipmaps=false;video.minFilter=T.LinearFilter;
 const bytes=new Uint8Array(await(await fetch('./qa/field'+i+'.bin')).arrayBuffer());
 const field=new T.DataTexture(bytes.subarray(0,360*198),360,198,T.RedFormat);
 const flow=new T.DataTexture(bytes.subarray(360*198),180,99,T.RGFormat);flow.minFilter=flow.magFilter=T.LinearFilter;flow.needsUpdate=true;
 field.minFilter=field.magFilter=T.LinearFilter;field.needsUpdate=true;
 pairs.push({video,field,flow});
}
const w=260,h=270,r=new T.WebGLRenderer({antialias:false});
const rt=new T.WebGLRenderTarget(w,h,{depthBuffer:false});r.setRenderTarget(rt);
const ray=new T.Matrix4().set(w/1600,0,0,(left+w/2-720)/800,0,h/1600,0,(792-top-h/2)/800,0,0,0,-1,0,0,0,1);
const u={video:{value:null},depthGrid:{value:null},flowGrid:{value:null},offset:{value:new T.Vector3()},inverseProj:{value:ray},toVideo:{value:new T.Matrix3()},k:{value:new T.Vector4(800/1440,800/1584,.5,.5)},eye:{value:0},pixel:{value:new T.Vector2(1/1440,-1/1584)},correction:{value:0}};
const scene=new T.Scene(),camera=new T.Camera(),mat=new T.ShaderMaterial({uniforms:u,...projectionShaders,depthTest:false,depthWrite:false,toneMapped:false});
const quad=new T.Mesh(new T.PlaneGeometry(2,2),mat);quad.frustumCulled=false;scene.add(quad);
window.replay=(t,eye,enabled)=>{
 const j=events.findLastIndex(([start])=>start<=t),[start,src]=events[j],x=t<=26?t:52-t;
 let interval=50;
 for(let i=1;i<j;i++)interval+=.15*((events[i][0]-events[i-1][0])*1000/90-interval);
 u.correction.value=j&&enabled?correctionWeight((t-start)*1000/90,correctionDuration(interval)):0;
 u.flowGrid.value=pairs[j].flow;
 u.video.value=pairs[j].video;u.depthGrid.value=pairs[j].field;u.eye.value=eye;u.offset.value.x=.008*(x-src);
 r.render(scene,camera);
 const raw=new Uint8Array(w*h*4);r.readRenderTargetPixels(rt,0,0,w,h,raw);
 const bytes=new Uint8Array(w*h*3);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const a=((h-1-y)*w+x)*4,b=(y*w+x)*3;for(let c=0;c<3;c++)bytes[b+c]=raw[a+c];}
 let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(s);
};
</script>
