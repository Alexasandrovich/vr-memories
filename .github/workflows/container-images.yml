name: Publish container images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - docs/**
      - scripts/**
      - viewer/dist/**
      - vendor-sharp/**
      - .github/workflows/container-images.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vr-memories
            file: Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: vr-memories-album
            file: docker/Album.Dockerfile
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: true
          labels: org.opencontainers.image.source=https://github.com/Alexasandrovich/vr-memories
          tags: |
            ghcr.io/alexasandrovich/${{ matrix.name }}:latest
            ghcr.io/alexasandrovich/${{ matrix.name }}:${{ github.sha }}
