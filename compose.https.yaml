services:
  https:
    image: caddy:2-alpine
    depends_on:
      web:
        condition: service_healthy
    configs:
      - source: lan-proxy
        target: /etc/caddy/Caddyfile
    ports:
      - "${VR_LAN_ADDRESS}:${VR_WEB_TLS_PORT:-8443}:443"
    volumes:
      - web-certs:/data
volumes:
  web-certs:
configs:
  lan-proxy:
    content: |
      {
        default_sni ${VR_LAN_ADDRESS:?Set the private LAN IPv4 address}
      }
      https://${VR_LAN_ADDRESS} {
        tls internal
        @questAlbum {
          path / /index.html
          header_regexp User-Agent (?i)(OculusBrowser|Quest)
          expression `"${VR_QUEST_ALBUM_URL:-}" != ""`
        }
        redir @questAlbum ${VR_QUEST_ALBUM_URL:-/} 302
        reverse_proxy web:7860
      }
